name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{sub("%", "", $NF); print $NF}')
          floor=74.0
          echo "total coverage: ${total}% (floor: ${floor}%)"
          if ! awk -v total="$total" -v floor="$floor" 'BEGIN { exit (total >= floor) ? 0 : 1 }'; then
            echo "coverage ${total}% is below the ${floor}% floor" >&2
            exit 1
          fi

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out

      - name: Check generated OpenAPI schemas are fresh
        run: |
          go generate ./internal/schema
          gofmt -w internal/schema/openapi_generated.go
          git diff --exit-code internal/schema/openapi_generated.go

      - name: Check generated CLI skills are fresh
        run: |
          go run ./cmd/umbraco generate-skills --output-dir skills/cli
          git diff --exit-code skills/cli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify skills bundle
        run: npm run verify:skills

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
